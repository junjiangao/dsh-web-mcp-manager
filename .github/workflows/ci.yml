name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 若此步失败，需在本地执行 `pnpm build` 后提交 lib/ 变更，
      # 确保重建产物与已提交产物零差异，防止源码与 lib/ 漂移。
      # （*.tsbuildinfo 已被 .gitignore 忽略，不影响 diff）
      - name: Check lib/ artifacts
        run: git diff --exit-code -- lib/
