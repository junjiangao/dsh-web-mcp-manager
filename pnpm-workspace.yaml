packages:
  - '.'

allowBuilds:
  esbuild: true

# Every dependency resolves from published registry versions, so no
# `minimumReleaseAgeExclude` entry is needed. If a future dsh prerelease is
# younger than the configured `minimumReleaseAge` window, add the exact
# `"@deepseek-ai/<pkg>@<version>"` key here rather than widening the age.
minimumReleaseAgeExclude: []
